ideologi Pancasila dan terlibat dalam aksi radikalisme atau perusakan ketertiban masyarakat","Memilih melanjutkan pendidikan ke luar negeri","Menggunakan produk buatan luar negeri","Mengkritik kebijakan sekolah secara santun dalam forum OSIS"],"k":1,"e":"Menolak Pancasila dan terlibat radikalisme/kerusuhan merupakan bentuk pengingkaran kewajiban bela negara dan hankam."},{"bab":4,"n":20,"lv":1,"s":"Solusi paling efektif untuk mengantisipasi dan mengatasi tindakan intoleransi dalam kehidupan beragama di lingkungan sekolah adalah...","o":["Mengisolasi siswa yang memiliki keyakinan berbeda agar tidak terjadi interaksi","Memberikan edukasi kebebasan beragama yang bertanggung jawab, menanamkan sikap toleransi, dan memberlakukan aturan sekolah yang tegas dan adil","Melarang seluruh kegiatan keagamaan di sekolah","Mewajibkan seluruh siswa berpindah ke agama mayoritas","Menyerahkan penyelesaian konflik kepada media massa"],"k":1,"e":"Solusi intoleransi adalah edukasi kebebasan beragama yang bijak, penanaman toleransi, dan regulasi sekolah yang tegas."},{"bab":4,"n":21,"lv":2,"s":"Seorang siswa tertangkap basah memaksa temannya memberikan jawaban saat ujian disertai ancaman verbal dan dorongan fisik. Ditinjau dari UUD NRI Tahun 1945, tindakan pemaksaan dan perlakuan kasar tersebut bertentangan dengan...","o":["Pasal 28G Ayat (1) tentang Hak atas Rasa Aman dan Bebas dari Ancaman Ketakutan, serta Pasal 28G Ayat (2) tentang Bebas dari Perlakuan yang Merendahkan Martabat","Pasal 27 Ayat (2) tentang Penghidupan yang Layak","Pasal 29 Ayat (1) tentang Negara Berdasar Ketuhanan YME","Pasal 33 Ayat (1) tentang Asas Kekeluargaan Ekonomi","Pasal 34 Ayat (1) tentang Pemeliharaan Fakir Miskin"],"k":0,"e":"Memaksa dan mengancam fisik melanggar Pasal 28G Ayat (1) (rasa aman/bebas takut) dan Pasal 28G Ayat (2) (bebas penyiksaan/martabat)."},{"bab":4,"n":22,"lv":2,"s":"Sebuah spanduk kepolisian memuat larangan: “Knalpot Bronx/Brong Bising Norak - melanggar UU No. 22 Tahun 2009 Pasal 48 Ayat 1”. Analisis hubungan antara larangan penggunaan knalpot bising dengan pemenuhan HAM warga negara berdasarkan Pasal 28J Ayat (2) UUD NRI 1945 adalah...","o":["Penggunaan knalpot bising adalah hak asasi ekspresi yang tidak boleh dibatasi undang-undang","Pembatasan penggunaan knalpot bising melalui UU merupakan pembatasan hukum yang sah demi menjamin hak orang lain atas ketenangan, kenyamanan, dan lingkungan hidup yang sehat","Polisi melanggar HAM pemilik motor yang memodifikasi kendaraannya","Pemerintah wajib mengganti rugi biaya modifikasi knalpot warga","Larangan knalpot bising hanya berlaku bagi kendaraan roda empat"],"k":1,"e":"Larangan knalpot bising adalah pembatasan sah UU (Pasal 28J Ayat 2) demi menjamin hak orang lain atas kenyamanan dan lingkungan sehat."},{"bab":4,"n":23,"lv":2,"s":"Seorang perokok pasif di tempat umum merasa terganggu kesehatannya akibat paparan asap rokok. Perbuatan merokok sembarangan di area bebas asap rokok merupakan bentuk pengingkaran kewajiban yang melanggar hak orang lain yang dijamin dalam UUD NRI 1945 Pasal...","o":["Pasal 28H Ayat (1) yang menyatakan setiap orang berhak hidup sejahtera lahir dan batin serta mendapatkan lingkungan hidup yang baik dan sehat","Pasal 27 Ayat (3) tentang Pembelaan Negara","Pasal 28D Ayat (4) tentang Status Kewarganegaraan","Pasal 31 Ayat (3) tentang Kurikulum Nasional","Pasal 32 Ayat (2) tentang Bahasa Daerah"],"k":0,"e":"Merokok sembarangan mengingkari kewajiban dan melanggar hak orang lain atas lingkungan hidup yang sehat (Pasal 28H Ayat 1)."},{"bab":4,"n":24,"lv":2,"s":"Dalam merancang proyek RANUMKAN pencegahan intoleransi, Kelompok 5 membuat media permainan monopoli simulasi. Di dalamnya, ditetapkan peran Hakim yang mengocok kartu dan memberi sanksi maju/mundur langkah berdasarkan kesantunan kata (maaf, tolong, terima kasih). Nilai pedagogis-karakter utama dari proyek ini adalah...","o":["Melatih siswa menjadi hakim profesional di pengadilan hukum","Menumbuhkan profil pelajar Pancasila yang kreatif, adil, antusias, dan mampu menginternalisasi pentingnya etika kesantunan serta kerjasama dalam mencegah intoleransi","Mengajarkan cara memenangkan permainan dengan memanipulasi aturan","Membuktikan bahwa kelompok mayoritas selalu memenangkan permainan","Mengganti seluruh mata pelajaran PPKn dengan permainan papan"],"k":1,"e":"Proyek RANUMKAN monopoli melatih karakter kreatif, adil, santun, dan kerja sama dalam menginternalisasi pencegahan intoleransi."},{"bab":4,"n":25,"lv":2,"s":"Hasil evaluasi BPIP mengindikasikan bahwa investasi di daerah perdesaan yang merusak lingkungan hidup cenderung memperbesar eksklusi sosial dan pemiskinan warga lokal. Analisis kritis atas fenomena ini menunjukkan terjadinya...","o":["Pelanggaran hak warga lokal atas lingkungan hidup yang sehat (Pasal 28H Ayat 1) akibat pengingkaran kewajiban investor/pemerintah dalam menjaga kelestarian ekologi","Keberhasilan pembangunan ekonomi perdesaan berasaskan liberalisme","Pelaksanaan kewajiban warga negara dalam mendukung investasi tanpa syarat","Bentuk jaminan sosial mutlak bagi masyarakat terbelakang","Ratifikasi kovenan hak politik perempuan di daerah perdesaan"],"k":0,"e":"Kerusakan lingkungan akibat investasi melanggar hak warga lokal atas lingkungan sehat dan bentuk pengingkaran kewajiban investor."},{"bab":4,"n":26,"lv":2,"s":"Sukarno menegaskan bahwa revolusi Indonesia adalah bagian dari revolution of mankind (revolusi kemanusiaan). Implikasi dari pandangan ini bagi warga negara muda di era digital saat ini adalah...","o":["Mengisolasi diri dari interaksi dengan masyarakat luar negeri","Mengembangkan sikap solidaritas kemanusiaan universal serta menggunakan kemajuan teknologi untuk menyebarkan gagasan solutif antipelanggaran HAM","Menganggap masalah pelanggaran hak hanya terjadi di negara berkembang","Mengutamakan perundungan siber kepada kelompok yang berbeda pandangan","Menolak seluruh sistem hukum nasional dan menggantinya dengan hukum adat"],"k":1,"e":"Implikasi revolution of mankind adalah membangun solidaritas kemanusiaan dan menggunakan teknologi untuk solusi antipelanggaran HAM."},{"bab":4,"n":27,"lv":2,"s":"Mengapa negara berhak melakukan tindakan pembatasan (restriction) atau pencabutan sementara terhadap Hak Derogable (seperti melarang unjuk rasa yang anarkis atau memblokir konten penyebar hoaks provokatif)?","o":["Karena negara memiliki kekuasaan mutlak yang tidak dapat diganggu gugat","Demi melindungi keamanan nasional, ketertiban umum, keselamatan publik, dan menghormati hak asasi orang lain dari ancaman kekacauan sosial","Karena hak derogable tidak memiliki nilai dalam tata hukum Indonesia","Untuk mempercepat proses pergantian konstitusi UUD NRI 1945","Karena seluruh warga negara telah menyetujui penghapusan hak berpendapat"],"k":1,"e":"Pembatasan Hak Derogable sah dilakukan demi keamanan nasional, ketertiban umum, dan perlindungan hak asasi warga lain."},{"bab":4,"n":28,"lv":2,"s":"Dalam sebuah permainan simulasi antiintoleransi, seorang peserta mendapatkan kartu yang memerintahkannya untuk mengucapkan kalimat menghina. Peserta tersebut menolak menjalankan perintah kartu dan memberikan alasan berbasis Pancasila. Sikap hakim yang paling berkeadilan adalah...","o":["Menghukum peserta tersebut dengan mengeluarkannya dari permainan","Mengapresiasi penolakan tersebut dan memberikan nilai kebaikan/kemajuan langkah karena peserta mampu mempertahankan prinsip integritas dan kesantunan","Memaksa peserta tetap mengucapkan kata menghina agar permainan ramai","Menghentikan seluruh permainan dan membubarkan kelompok","Mengabaikan keputusan peserta dan melanjutkan permainan tanpa catatan"],"k":1,"e":"Menolak ucapan menghina adalah tindakan tepat yang harus diapresiasi hakim karena menjunjung tinggi kesantunan dan integritas."},{"bab":4,"n":29,"lv":2,"s":"Sila Kemanusiaan yang Adil dan Beradab mengajarkan bahwa keberagaman Indonesia yang berada pada persilangan benua dan samudra menjadikan Indonesia sebagai “medan perjumpaan antarperadaban”. Sikap generasi solutif dalam menghadapi perbedaan budaya dan agama adalah...","o":["Menganggap budaya sendiri sebagai satu-satunya budaya yang paling beradab","Membangun kebiasaan hidup inklusif, menghargai martabat manusia (human dignity), serta menjunjung tinggi hak asasi sesama warga negara","Menghapuskan seluruh perbedaan budaya agar menjadi seragam","Menolak bekerja sama dengan warga negara yang berbeda suku","Membiarkan terjadinya persekusi atas nama kebebasan berekspresi"],"k":1,"e":"Sikap generasi solutif di medan perjumpaan peradaban adalah hidup inklusif dan menjunjung tinggi martabat kemanusiaan (human dignity)."},{"bab":4,"n":30,"lv":2,"s":"Seorang pelajar melihat temannya menjadi korban perundungan fisik dan verbal di area belakang sekolah. Tindakan solutif berkarakter Warga Negara Muda ASIK & RANUMKAN yang paling tepat dilakukan adalah...","o":["Ikut merundung agar dianggap kompak oleh teman-teman lain","Memfoto peristiwa tersebut dan membagikannya ke media sosial dengan judul provokatif tanpa melapor","Segera menghentikan perundungan secara santun jika mampu, mendampingi korban, serta melaporkan kejadian kepada guru/pihak sekolah untuk mendapatkan penanganan hukum dan psikologis yang adil","Merekam kejadian dan meminta imbalan uang dari pelaku perundungan","Acuh tak acuh karena menganggap masalah tersebut adalah urusan pribadi mereka"],"k":2,"e":"Tindakan solutif pelajar adalah menghentikan perundungan santun, mendampingi korban, dan melapor ke guru/sekolah untuk keadilan."},{"bab":3,"n":"U1","lv":1,"s":"Makna sila Ketuhanan Yang Maha Esa dalam pelaksanaan keyakinan bagi tiap penduduk sebagai implementasi hak pada Pasal 29 ayat (2) UUD NRI Tahun 1945, yakni ….","o":["setiap orang yang hidup di Indonesia boleh berkeyakinan apa saja","setiap orang yang tinggal di Indonesia dilindungi dalam berkeyakinan apa saja","setiap warga negara dilindungi untuk beragama dan berkeyakinan terhadap Tuhan YME","setiap orang yang tinggal di Indonesia dilindungi untuk beragama dan berkeyakinan terhadap Tuhan YME","setiap orang boleh beragama dan berkeyakinan terhadap Tuhan YME"],"k":3,"e":"Pasal 29 ayat (2) menjamin kemerdekaan tiap penduduk untuk beragama dan beribadat. Perlindungan berlaku bagi semua orang yang tinggal di Indonesia (bukan hanya warga negara, sehingga C salah) dan keyakinannya terhadap Tuhan YME (bukan “apa saja”, sehingga A dan B salah). E hanya menyebut “boleh”, tanpa unsur perlindungan negara."},{"bab":3,"n":"U2","lv":1,"s":"Makna sila Kemanusiaan yang Adil dan Beradab dalam perlakuan terhadap warga negara di dalam mengeluarkan pendapat berdasarkan Pasal 28 UUD NRI Tahun 1945, yakni ….","o":["siapa saja yang tinggal di Indonesia dapat mengeluarkan pendapat sesuai prosedur yang benar","setiap orang yang memiliki domisili di Indonesia dapat mengeluarkan pendapat sesuai prosedur yang berlaku","warga negara dapat menyampaikan pendapatnya di mana dan kapan pun untuk mengubah kebijakan dengan prosedur yang benar","warga negara hanya boleh mengeluarkan pendapatnya di mana dan kapan pun jika sesuai dengan prosedur musyawarah","warga negara dapat mengungkapkan seluruh pendapatnya sesuai paradigma ilmiah berpikirnya"],"k":2,"e":"Soal menanyakan perlakuan terhadap warga negara, sehingga A dan B (subjek “siapa saja” dan “orang yang berdomisili”) kurang tepat. Kebebasan berpendapat dijamin, termasuk untuk memengaruhi kebijakan, selama lewat prosedur yang benar. D membatasi hanya pada musyawarah, sedangkan E mengaitkan pendapat dengan satu paradigma saja."},{"bab":3,"n":"U3","lv":1,"s":"Makna sila Persatuan Indonesia dalam pelaksanaan pertahanan dan keamanan bangsa sebagai implementasi Pasal 27 ayat (3) dan Pasal 30 UUD NRI Tahun 1945, yakni ….","o":["negara dapat melakukan apa saja jika negara dalam keadaan genting terhadap bangsa Indonesia","negara dapat melakukan tindakan represif untuk ketertiban jika negara dalam keadaan genting","negara dapat menertibkan siapa pun dengan alasan dan keadaan apa pun","negara akan menjalin kerja sama dengan luar negeri untuk keamanan dalam negeri jika keadaan genting","negara melindungi warga negara Indonesia sepanjang masih berada di tanah air"],"k":1,"e":"Demi persatuan, negara berwenang bertindak tegas untuk menjaga ketertiban saat keadaan genting, dengan batas tertentu. A dan C menyiratkan kekuasaan tanpa batas. D bukan inti pertahanan dan keamanan rakyat semesta. E salah karena perlindungan negara tidak terbatas pada warga yang berada di tanah air."},{"bab":3,"n":"U4","lv":1,"s":"Makna sila Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan dalam pelaksanaan pengambilan keputusan di ruang publik sebagai implementasi HAM di Indonesia, yakni ….","o":["setiap usulan untuk legitimasi keinginan rakyat harus dikabulkan","segala keputusan untuk kebijakan publik mengacu pada kepentingan kekuasaan yang mengatasnamakan rakyat","segala kebijakan merupakan hasil kajian sosiologis, politis, dan hukum yang terjadi di masyarakat","kebijakan diambil untuk terpenuhinya segala keinginan rakyat","seluruh usulan kebijakan publik harus berdasarkan referendum rakyat"],"k":2,"e":"“Hikmat kebijaksanaan” berarti keputusan publik diambil melalui pertimbangan matang atas kondisi sosial, politik, dan hukum. Bukan semua usulan atau keinginan rakyat harus dikabulkan (A, D), bukan demi kekuasaan (B), dan tidak semua kebijakan harus lewat referendum (E)."},{"bab":3,"n":"U5","lv":1,"s":"Makna sila Keadilan Sosial bagi Seluruh Rakyat Indonesia dalam pelaksanaan standar hidup layak sebagai implementasi HAM di Indonesia, yakni ….","o":["setiap warga negara Indonesia berhak atas hidup layak berdasarkan standar kemampuan negara dan masyarakatnya","setiap warga negara berhak untuk mendapatkan berbagai kemudahan dan hidup mapan sesuai janji pemerintah ketika kampanye","setiap warga negara akan diberikan fasilitas dan kemudahan tertentu jika menjadi warga yang baik","negara akan melakukan operasi pasar apabila terjadi kecurangan oleh pedagang","kelayakan ditentukan dengan standar pertumbuhan ekonomi hasil perbandingan dengan negara Asia Tenggara"],"k":0,"e":"Hak atas hidup layak dijamin bagi semua warga dan dipenuhi sesuai kemampuan negara dan masyarakat. B dan C mengaitkan hak dengan janji kampanye atau syarat “warga baik”. D hanya satu tindakan teknis, dan E memakai tolok ukur yang tidak relevan."},{"bab":3,"n":"U6","lv":2,"s":"Perda yang dilansir dalam gambar tersebut menurut kamu merupakan tindakan yang bertujuan untuk ….","o":["meninggikan derajat manusia dari makhluk lainnya","manusia Indonesia berpendidikan","manusia Indonesia beragama","manusia Indonesia memiliki lembaga perkawinan","manusia Indonesia dilarang mengumbar hawa nafsunya"],"k":0,"e":"Perda melarang perbuatan asusila dan perilaku yang menimbulkan persangkaan buruk di tempat umum. Tujuan akhirnya menjaga martabat manusia sebagai makhluk bermoral, sehingga derajatnya terjaga dari makhluk lain. E hanya menggambarkan isi larangan, sedangkan B, C, dan D tidak diatur dalam perda.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U7","lv":2,"s":"Dari klausul hukum yang disampaikan perda tersebut, kita dianggap melakukan pelanggaran HAM jika melakukan hal berikut ini, kecuali ….","o":["berpelukan di tempat umum yang mengundang prasangka buruk","melakukan tindak amoral di taman","melakukan tindakan pelecehan seksual baik sengaja maupun tidak","melakukan tindakan yang dianggap oleh masyarakat amoral walaupun tidak ada yang terusik","mengingatkan orang lain untuk tidak melakukan sesuai dengan klausul perda tersebut"],"k":4,"e":"Pada soal berpola “kecuali”, pilihan A sampai D adalah perbuatan yang dilarang perda dan melanggar hak orang lain. E justru tindakan terpuji karena mengajak menaati aturan, sehingga bukan pelanggaran.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U8","lv":2,"s":"Menurut gambar, maksud dari klausul perda tersebut dengan kata “menimbulkan persangkaan….” mengindikasikan bahwa ….","o":["setiap orang boleh saling curiga jika terjadi penyimpangan","setiap orang harus waspada terhadap segala bentuk penyimpangan","setiap orang boleh berburuk sangka apabila ada masyarakat yang pergi ke taman, jalan, dan tempat umum","masyarakat memiliki standar nilai asusila berdasarkan persepsi masing-masing","perilaku yang menimbulkan kecurigaan atas standar nilai kesusilaan di masyarakat tidak boleh dilakukan"],"k":4,"e":"Frasa tersebut menunjuk pada perilaku yang dinilai melanggar standar kesusilaan umum di masyarakat, sehingga dilarang. A, B, dan C mendorong curiga berlebihan, sedangkan D menyebut standar bersifat pribadi, padahal yang dipakai ialah standar masyarakat.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U9","lv":2,"s":"Pernyataan berikut ini dapat dikategorikan asumsi terhadap isi perda pada gambar sebagai warga negara yang baik, yakni ….","o":["masyarakat Indonesia kini mengindikasikan berperilaku tidak bermoral","banyaknya tindakan yang tidak terpuji di tempat-tempat umum","langkah preventif untuk kepentingan perlindungan HAM","agar tempat umum bersih dari perbuatan yang menyimpang","memperlihatkan bahwa bangsa Indonesia bermoral baik"],"k":2,"e":"Warga yang baik menilai perda secara positif dan konstruktif, yaitu sebagai langkah pencegahan untuk melindungi HAM. A dan B menuduh masyarakat, E tidak menjelaskan fungsi perda, dan D hanya menyebut hasil, bukan alasan perlindungan HAM.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U10","lv":2,"s":"Manakah asumsi pemerintah yang paling tepat ketika menetapkan perda pada gambar dalam upaya meningkatkan nilai martabat kemanusiaan ….","o":["menjunjung tinggi nilai kemanusiaan berdasarkan Ketuhanan YME menjadi tanggung jawab negara","memperkenalkan kepada seluruh dunia tentang ajaran hak asasi manusia versi Indonesia","negara hendak mengatur urusan pribadi seluruh bangsa Indonesia","kekhawatiran terjadinya kejahatan seksual di tempat-tempat umum","banyak terjadi kejahatan seksual yang terjadi di tempat-tempat umum"],"k":0,"e":"Meningkatkan martabat kemanusiaan adalah tanggung jawab negara yang dilandasi sila Ketuhanan YME dan Kemanusiaan. B, C, D, dan E merupakan dugaan atau tuduhan yang tidak menjadi dasar resmi pembentukan perda.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U11","lv":2,"s":"Berikut ini merupakan argumentasi kamu untuk mendukung perda tersebut sebagai warga negara Indonesia yang berideologi Pancasila, yakni ….","o":["memahami dan melaksanakan isi perda karena itu kebijakan negara","selama isi perda tersebut tidak mengganggu nilai-nilai pribadi saya, akan saya patuhi","negara Indonesia berketuhanan YME, nilai kemanusiaan dipertanggungjawabkan pada Tuhan dan masyarakat","pengambil kebijakan terlalu berlebihan dalam melindungi hak pribadi tiap orang","perda tersebut wajar dibuat agar seluruh masyarakat belajar bagaimana berperilaku yang sebenarnya"],"k":2,"e":"Argumen berideologi Pancasila bersandar pada nilai sila ke-1 dan ke-2, yaitu kemanusiaan dipertanggungjawabkan kepada Tuhan dan masyarakat. A hanya alasan taat, B bersyarat pada kepentingan pribadi, D menolak perda, dan E merendahkan masyarakat.","st":["Analisislah gambar berikut.","PERDA NO. 5 Thn. 2002, PASAL 24 AYAT 2","Dilarang setiap orang yang bertingkah laku menimbulkan persangkaan akan berbuat asusila / perzinahan untuk berada di jalan, taman, dan tempat umum. Pelanggaran terhadap ketentuan dalam Perda ini dapat diancam dengan pidana kurungan paling lama 6 (enam) bulan atau denda sebesar-besarnya Rp5.000.000,- (lima juta rupiah).","Sumber: ppt Materi Hukum PLPG 2013"]},{"bab":3,"n":"U12","lv":0,"s":"Pelanggaran HAM berat di antaranya ialah kejahatan terhadap kemanusiaan. Berikut ini salah satu contohnya ….","o":["pembunuhan massal terhadap sekelompok ras","pembantaian kaum mayoritas terhadap kaum minoritas untuk menghilangkan turunan","kebencian Nazi kepada kaum Yahudi","menjegal seseorang yang berprestasi untuk tidak berkembang karier","memberi label pada seseorang yang menyebabkan dia secara mental dan fisik tidak mampu melanjutkan kehidupan normalnya"],"k":0,"e":"Kejahatan terhadap kemanusiaan mencakup pembunuhan yang meluas dan sistematis terhadap penduduk sipil. B bercirikan niat memusnahkan kelompok (genosida), C hanya menyebut kebencian, D persaingan tidak sehat, dan E perundungan individual."},{"bab":3,"n":"U13","lv":0,"s":"Berdasarkan berita di atas, kasus pelanggaran HAM intoleransi bertentangan dengan UUD NRI Tahun 1945, terutama Pasal ….","o":["28A","28D ayat (1)","28E ayat (1)","28E ayat (2)","28E ayat (3)"],"k":2,"e":"Pasal 28E ayat (1) menjamin kebebasan memeluk agama dan beribadat menurut agamanya. Penyerangan terhadap jemaah yang sedang salat Idulfitri melanggar hak ini.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U14","lv":0,"s":"Berdasarkan berita tersebut, kasus pelanggaran hak hidup, rasa aman, dan perlindungan dari ancaman ketakutan, bertentangan dengan UUD NRI Tahun 1945, terutama Pasal ….","o":["28G ayat (1)","28G ayat (2)","28H ayat (1)","28H ayat (2)","28H ayat (3)"],"k":0,"e":"Pasal 28G ayat (1) mengatur perlindungan diri pribadi serta rasa aman dan perlindungan dari ancaman ketakutan. Ayat (2) mengenai bebas dari penyiksaan, sedangkan 28H tentang kesejahteraan dan jaminan sosial.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U15","lv":0,"s":"Berdasarkan berita di atas, kasus pelanggaran properti tidak boleh diambil alih secara sewenang-wenang bertentangan dengan UUD NRI Tahun 1945, terutama Pasal ….","o":["28G ayat (2)","28H ayat (1)","28H ayat (2)","28H ayat (3)","28H ayat (4)"],"k":4,"e":"Pasal 28H ayat (4) menyatakan hak milik pribadi tidak boleh diambil alih secara sewenang-wenang oleh siapa pun.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","I anggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U17","lv":2,"s":"Pemberitaan tersebut apabila dipahami sebagai sebuah pembelajaran, hal positif yang dapat diambil sebagai negara multikultural ialah ….","o":["saling menghormati antarkeyakinan yang berbeda","saling menghormati bahwa Tuhan menciptakan manusia berkaum-kaum","saling menghormati bahwa keberagaman merupakan kekayaan hati untuk menerima perbedaan","saling menghormati antara pendiri negara yang menetapkan ideologi dan umat beragama","saling menghormati bahwa segala perilaku harus dipertanggungjawabkan kepada masyarakat dan kepada Tuhan YME"],"k":2,"e":"Ciri negara multikultural adalah memandang keberagaman sebagai kekayaan yang diterima dengan lapang hati. Pilihan lain bergeser ke sudut pandang keyakinan, penciptaan, ideologi, atau tanggung jawab perilaku.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U18","lv":2,"s":"Pemberitaan di atas apabila dipahami sebagai sebuah pembelajaran, hal positif yang dapat diambil sebagai negara berdasarkan Pancasila ialah ….","o":["saling menghormati antarkeyakinan yang berbeda","saling menghormati bahwa Tuhan menciptakan manusia berkaum-kaum","saling menghormati bahwa keberagaman merupakan kekayaan hati untuk menerima perbedaan","saling menghormati antarpendiri negara yang menetapkan ideologi dan dijadikan pandangan hidup bangsa","saling menghormati bahwa segala perilaku harus dipertanggungjawabkan kepada masyarakat dan kepada Tuhan YME"],"k":3,"e":"Sudut pandang “negara berdasarkan Pancasila” merujuk pada kesepakatan para pendiri negara yang menetapkan Pancasila sebagai pandangan hidup bangsa. Menghormati kesepakatan itu berarti menghormati keberagaman yang dinaunginya.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U19","lv":2,"s":"Pemberitaan di atas apabila dipahami sebagai sebuah pembelajaran, hal positif yang dapat diambil sebagai negara yang melindungi hak warganya ialah ….","o":["saling menghormati antarmasyarakat dengan keyakinan yang berbeda","saling menghormati bahwa Tuhan menciptakan manusia berkaum-kaum","saling menghormati bahwa keberagaman merupakan kekayaan hati untuk menerima perbedaan","saling menghormati antara pendiri negara yang menetapkan ideologi dan umat beragama","menghormati karena segala perilaku harus dipertanggungjawabkan kepada masyarakat dan kepada Tuhan YME"],"k":0,"e":"Negara melindungi hak warga, termasuk hak beribadat, dengan mendorong rasa saling menghormati antarmasyarakat yang berbeda keyakinan. Hal ini sejalan dengan Pasal 28E dan Pasal 29 UUD NRI Tahun 1945.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":3,"n":"U20","lv":2,"s":"Berikut ini perilaku yang akan dilakukan pelajar sebagai warga negara yang cerdas ketika membaca pemberitaan di atas ….","o":["menganggap konflik tersebut wajar terjadi di daerah yang mayoritas salah satu agama","mengonfirmasi berita agar tidak terpapar hoaks dan kebencian","meyakinkan teman lain untuk mendukung salah satu pihak yang dianggap benar","membiarkan saja karena peristiwa tersebut tidak terjadi di wilayah sendiri","menyalahkan pemerintah yang lamban menangani"],"k":1,"e":"Warga negara cerdas memeriksa kebenaran informasi sebelum menyikapi atau menyebarkannya. A, C, D, dan E mencerminkan prasangka, keberpihakan, sikap acuh, atau menyalahkan tanpa dasar.","st":["Analisislah berita berikut ini.","Jakarta, CNN Indonesia — Komisi Nasional Hak Asasi Manusia menemukan ada empat pelanggaran HAM dalam kerusuhan yang pecah di Karubaga, Kabupaten Tolikara, Papua pada 17 Juli 2015 lalu. Komisioner Komnas HAM Maneger Nasution mengatakan, empat pelanggaran HAM yang terjadi adalah intoleransi, pelanggaran hak hidup, pelanggaran rasa aman, dan pelanggaran properti.","Intoleransi terjadi karena ada penyerangan terhadap warga yang tengah menggelar ibadah. Saat itu, massa menyerang umat muslim yang sedang salat Idulfitri di lapangan Koramil. Sementara untuk pelanggaran hak hidup terjadi karena ada warga yang tewas tertembak. “Kami mendorong cari tahu siapa pelakunya,” kata Maneger kepada CNN Indonesia, Senin (10/8). Saat kejadian, petugas keamanan melepas tembakan karena massa mengabaikan imbauan petugas. Saat itu dinyatakan ada 12 orang terluka. Belakangan disebutkan ada satu warga tewas karena luka tembak.","Sumber: Suriyanto/CNN Indonesia (2015)"]},{"bab":4,"n":"U21","lv":0,"s":"Jaminan HAM di Indonesia di mana bangsa Indonesia merupakan bagian dari masyarakat dunia secara idiil terdapat dalam ….","o":["sila ke-1 Pancasila","sila ke-2 Pancasila","sila ke-3 Pancasila","sila ke-4 Pancasila","sila ke-5 Pancasila"],"k":1,"e":"Sila Kemanusiaan yang Adil dan Beradab menjadi dasar idiil jaminan HAM dan pengakuan bahwa bangsa Indonesia adalah bagian dari masyarakat dunia."},{"bab":4,"n":"U22","lv":1,"s":"Perhatikan gambar perilaku di atas. Secara kasat mata, perbuatan menyalin dengan dan/atau tanpa paksaan merupakan perbuatan yang melanggar HAM. Namun, perilaku kasar pada gambar bertentangan dengan pasal ….","o":["28G ayat (2): Setiap orang berhak untuk bebas dari penyiksaan atau perlakuan yang merendahkan derajat martabat manusia dan berhak memperoleh suaka politik dari negara lain.","28H ayat (1): Setiap orang berhak hidup sejahtera lahir dan batin, bertempat tinggal, dan mendapatkan lingkungan hidup yang baik dan sehat serta berhak memperoleh pelayanan kesehatan.","28H ayat (2): Setiap orang berhak mendapat kemudahan dan perlakuan khusus untuk memperoleh kesempatan dan manfaat yang sama guna mencapai persamaan dan keadilan.","28H ayat (3): Setiap orang berhak atas jaminan sosial yang memungkinkan pengembangan dirinya secara utuh sebagai manusia yang bermartabat.","28H ayat (4): Setiap orang berhak mempunyai hak milik pribadi dan hak milik tersebut tidak boleh diambil alih secara sewenang-wenang oleh siapa pun."],"k":0,"e":"Perilaku kasar dan memaksa adalah perlakuan yang merendahkan martabat manusia, yang dilarang oleh Pasal 28G ayat (2). Pasal 28H mengatur kesejahteraan, kemudahan, jaminan sosial, dan hak milik.","st":["Perhatikan ilustrasi berikut: seorang siswa memaksa temannya memberikan contekan dengan sikap kasar saat ujian. Keterangan pada gambar: “Tidak untuk ditiru!”"]},{"bab":4,"n":"U23","lv":2,"s":"Jika dianalisis berdasarkan Pasal 28C ayat (1) UUD NRI Tahun 1945 yang berisi “Setiap orang berhak mengembangkan diri melalui pemenuhan kebutuhan dasarnya, berhak mendapat pendidikan dan memperoleh manfaat dari ilmu pengetahuan dan teknologi, seni, dan budaya, demi meningkatkan kualitas hidupnya dan demi kesejahteraan umat manusia”, peristiwa pada gambar di atas mengindikasikan bahwa ….","o":["pelaku penyontekan telah memperoleh manfaat dari ilmu pengetahuan dan teknologi dari yang dinyonteki sebagai hak asasinya","pengembangan diri melalui pemenuhan kebutuhan dasar pelaku penyontekan telah tercapai karena terbantu dari sontekannya","korban penyontekan mendapat pendidikan dari pengembangan diri melalui pemanfaatan ilmu pengetahuan dan teknologinya","atas persetujuan orang yang dinyonteki, pelaku penyontekan dapat memenuhi kebutuhan dasarnya demi meningkatkan kualitas hidupnya","korban penyontekan tidak mendapatkan hak mengembangkan diri demi meningkatkan kualitas hidupnya atas manfaat dari ilmunya"],"k":4,"e":"Pada gambar, korban dipaksa memberi contekan sehingga hasil belajarnya tidak dapat ia manfaatkan untuk mengembangkan diri. Pilihan A sampai D keliru karena membenarkan menyontek sebagai hak atau pengembangan diri.","st":["Perhatikan ilustrasi berikut: seorang siswa memaksa temannya memberikan contekan dengan sikap kasar saat ujian. Keterangan pada gambar: “Tidak untuk ditiru!”"]},{"bab":4,"n":"U24","lv":0,"s":"Jika merasa dirugikan atas peristiwa penyontekan, siswa dapat mengadukan pelanggaran hukum atas haknya untuk dilindungi sebagai warga negara yang sama di hadapan hukum, sesuai yang termaktub dalam UUD NRI Tahun 1945 pasal ….","o":["28D ayat (1): Setiap orang berhak atas pengakuan, jaminan, perlindungan, dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum.","28D ayat (2): Setiap orang berhak untuk bekerja serta mendapat imbalan dan perlakuan yang adil dan layak dalam hubungan kerja.","28D ayat (3): Setiap warga negara berhak memperoleh kesempatan yang sama dalam pemerintahan.","28D ayat (4): Setiap orang berhak atas status kewarganegaraan.","28E ayat (1): Setiap orang bebas memeluk agama dan beribadat menurut agamanya, memilih pendidikan dan pengajaran, memilih pekerjaan, memilih kewarganegaraan, memilih tempat tinggal di wilayah negara dan meninggalkannya, serta berhak kembali."],"k":0,"e":"Hak dilindungi dan diperlakukan sama di hadapan hukum diatur dalam Pasal 28D ayat (1). Ayat lain mengatur pekerjaan, pemerintahan, dan kewarganegaraan.","st":["Perhatikan ilustrasi berikut: seorang siswa memaksa temannya memberikan contekan dengan sikap kasar saat ujian. Keterangan pada gambar: “Tidak untuk ditiru!”"]},{"bab":4,"n":"U25","lv":1,"s":"Pada gambar di atas, terdapat unsur paksaan agar memberikan sontekan. Hal ini bertentangan dengan Pasal 28G ayat (1) yang berisi ….","o":["Setiap orang berhak atas pengakuan, jaminan, perlindungan, dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum.","Setiap orang berhak untuk bekerja serta mendapat imbalan dan perlakuan yang adil dan layak dalam hubungan kerja.","Setiap orang berhak atas perlindungan diri pribadi, keluarga, kehormatan, martabat, dan harta benda yang di bawah kekuasaannya, serta berhak atas rasa aman dan perlindungan dari ancaman ketakutan untuk berbuat atau tidak berbuat sesuatu yang merupakan hak asasi.","Setiap orang berhak hidup sejahtera lahir dan batin, bertempat tinggal, dan mendapatkan lingkungan hidup yang baik dan sehat serta berhak memperoleh pelayanan kesehatan.","Setiap orang berhak mendapat kemudahan dan perlakuan khusus untuk memperoleh kesempatan dan manfaat yang sama guna mencapai persamaan dan keadilan."],"k":2,"e":"Isi Pasal 28G ayat (1) adalah perlindungan diri, rasa aman, dan perlindungan dari ancaman ketakutan untuk berbuat atau tidak berbuat sesuatu. Paksaan menyontek melanggar hal ini. Pilihan lain adalah isi pasal yang berbeda.","st":["Perhatikan ilustrasi berikut: seorang siswa memaksa temannya memberikan contekan dengan sikap kasar saat ujian. Keterangan pada gambar: “Tidak untuk ditiru!”"]},{"bab":4,"n":"U26","lv":1,"s":"Dalam Pasal 28J ayat (1) yang berisi “Setiap orang wajib menghormati hak asasi manusia orang lain dalam tertib kehidupan bermasyarakat, berbangsa, dan bernegara”, gambar di atas mengindikasikan sebuah peringatan pada perilaku masyarakat Indonesia yang berkenaan dengan HAM, yaitu ….","o":["dilarang menggunakan kendaraan yang mengeluarkan suara","kendaraan yang laik jalan dapat memenuhi HAM untuk hidup tertib","setiap yang memiliki kendaraan harus menggunakan kendaraan yang memiliki knalpot","adanya larangan bagi yang memiliki kendaraan untuk memodif kendaraannya","masyarakat yang tidak hidup tertib dilarang menggunakan kendaraan yang bising"],"k":1,"e":"Pasal 28J ayat (1) menekankan kewajiban menghormati hak orang lain atas ketertiban. Kendaraan yang laik jalan (misalnya berknalpot standar) memenuhi hak orang lain untuk hidup tertib dan tenang. A, C, D terlalu sempit atau berlebihan, sedangkan E menyalahi logika karena membatasi orang, bukan kendaraan.","st":["Perhatikan gambar berikut: peringatan bagi pengendara kendaraan bermotor yang menggunakan knalpot bising. (Sumber: serangtimur.co.id, 2019)"]},{"bab":4,"n":"U27","lv":0,"s":"Peraturan lalu lintas yang dilansir dalam gambar di atas memberikan pendidikan ketaatan hukum dan penghormatan terhadap hak asasi yang termaktub dalam Pasal 28J ayat (2) UUD NRI Tahun 1945, yakni ….","o":["Dalam menjalankan hak dan kebebasannya, setiap orang wajib tunduk kepada pembatasan yang ditetapkan dengan undang-undang dengan maksud semata-mata untuk menjamin pengakuan serta penghormatan atas hak dan kebebasan orang lain.","Setiap orang berhak mengembangkan diri melalui pemenuhan kebutuhan dasarnya, berhak mendapat pendidikan dan memperoleh manfaat dari ilmu pengetahuan dan teknologi, seni dan budaya, demi meningkatkan kualitas hidupnya dan demi kesejahteraan umat manusia.","Setiap orang berhak untuk memajukan dirinya dalam memperjuangkan haknya secara kolektif untuk membangun masyarakat, bangsa, dan negaranya.","Setiap orang berhak atas pengakuan, jaminan, perlindungan, dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum.","Setiap orang berhak untuk bekerja serta mendapat imbalan dan perlakuan yang adil dan layak dalam hubungan kerja."],"k":0,"e":"Bunyi Pasal 28J ayat (2) adalah kewajiban tunduk pada pembatasan yang ditetapkan undang-undang demi menjamin hak dan kebebasan orang lain. B adalah Pasal 28C ayat (1), C adalah Pasal 28C ayat (2), D adalah Pasal 28D ayat (1), dan E adalah Pasal 28D ayat (2).","st":["Perhatikan gambar berikut: peringatan bagi pengendara kendaraan bermotor yang menggunakan knalpot bising. (Sumber: serangtimur.co.id, 2019)"]},{"bab":4,"n":"U28","lv":0,"s":"Perokok pasif merasa dilanggar hak hidupnya untuk sehat dan jaminan pelayanan kesehatan. Padahal, dalam UUD NRI Tahun 1945, terdapat jaminan terhadap hal tersebut, yakni terdapat dalam pasal ….","o":["28G ayat (1): Setiap orang berhak atas perlindungan diri pribadi, keluarga, kehormatan, martabat, dan harta benda yang di bawah kekuasaannya, serta berhak atas rasa aman dan perlindungan dari ancaman ketakutan untuk berbuat atau tidak berbuat sesuatu yang merupakan hak asasi.","28G ayat (2): Setiap orang berhak untuk bebas dari penyiksaan atau perlakuan yang merendahkan derajat martabat manusia dan berhak memperoleh suaka politik dari negara lain.","28H ayat (1): Setiap orang berhak hidup sejahtera lahir dan batin, bertempat tinggal, dan mendapatkan lingkungan hidup yang baik dan sehat serta berhak memperoleh pelayanan kesehatan.","28H ayat (2): Setiap orang berhak mendapat kemudahan dan perlakuan khusus untuk memperoleh kesempatan dan manfaat yang sama guna mencapai persamaan dan keadilan.","28H ayat (3): Setiap orang berhak atas jaminan sosial yang memungkinkan pengembangan dirinya secara utuh sebagai manusia yang bermartabat."],"k":2,"e":"Hak atas lingkungan hidup yang baik dan sehat serta pelayanan kesehatan dijamin Pasal 28H ayat (1). Perokok pasif haknya atas udara dan lingkungan sehat terganggu."},{"bab":4,"n":"U29","lv":2,"s":"Berikut ini perilaku yang ditampilkan seorang siswa yang memahami kasus pelanggaran HAM apabila terdapat penegakan disiplin di sekolah, yakni ….","o":["meyakini bahwa kedisiplinan ialah bagian dari pembelajaran","melaporkan tiap kegiatan mendisiplinkan sebagai pelanggaran HAM","bersikap paham terhadap aturan kedisiplinan","memercayai kedisiplinan bagian dari proses kebaikan","bertindak sesuai aturan dan komitmen yang berlaku"],"k":4,"e":"Siswa yang benar-benar memahami ditunjukkan lewat perbuatan nyata, yakni bertindak sesuai aturan dan komitmen. A, C, dan D hanya sikap atau keyakinan di dalam hati, sedangkan B keliru karena menganggap semua penegakan disiplin sebagai pelanggaran HAM."},{"bab":4,"n":"U30","lv":2,"s":"Jika terjadi pengingkaran kewajiban sebagai warga negara dalam bidang pendidikan, perbaikan yang akan saya lakukan selayaknya seorang pelajar ialah ….","o":["membuat kebijakan kurikulum yang lebih baik","membuat keputusan dalam musyawarah OSIS","memenuhi kewajiban pada orang tua","belajar dengan sungguh-sungguh untuk masa depan","mencari alternatif pendidikan yang lebih baik"],"k":3,"e":"Kewajiban pelajar dalam bidang pendidikan adalah belajar dengan sungguh-sungguh. A bukan wewenang pelajar, B dan C di luar bidang pendidikan, dan E tidak memperbaiki kewajiban yang diingkari."}];let Q=[];const L="ABCDE",DUR=60*60,LV=["Mudah","Sedang","HOTS"];

function confirmEnd(){const u=S.ans.filter(a=>a===null).length,f=S.fl.filter(Boolean).length;
let m="Kumpulkan jawaban sekarang?";if(u)m=u+" soal belum dijawab. ";if(f)m+=(u?"":"")+f+" soal masih ditandai ragu-ragu. ";if(u||f)m+="Tetap kumpulkan?";
ask("<b>Kumpulkan jawaban sekarang?</b><p>Terjawab: "+(Q.length-u)+" · Belum dijawab: "+u+" · Ragu-ragu: "+f+"</p>"+(u||f?"<p class=\"mu\">Masih ada soal yang belum dijawab atau ditandai ragu-ragu.</p>":"<p class=\"mu\">Setelah dikumpulkan, jawaban tidak dapat diubah.</p>"),"Ya, kumpulkan",finish);}
function ask(h,ok,cb){const o=document.createElement("div");o.id="md";o.className="ov";o.innerHTML='<div class="mdl" role="dialog" aria-modal="true">'+h+'<div class="row"><button id="mc">Kembali</button><button class="p" id="my">'+ok+'</button></div></div>';document.body.appendChild(o);document.getElementById("mc").onclick=()=>o.remove();document.getElementById("my").onclick=()=>{o.remove();cb();};}
function finish(c){const md=document.getElementById("md");if(md)md.remove();if(S.done)return;S.done=true;S.cheat=c===true;clearInterval(S.t);result("all");kirim(c);}
function cheatResult(){const sc=skor(Q.map((q,i)=>S.ans[i]===q.k));app.innerHTML=`<div class="card"><h1>Ujian dikumpulkan otomatis</h1><div class="mu">${esc(S.name)} · Kelas ${esc(S.kelas)} · ${new Date().toLocaleString("id-ID")}</div><p style="color:var(--no);font-weight:700">Sistem mendeteksi kamu meninggalkan halaman ujian (membuka tab atau jendela lain), sehingga jawabanmu otomatis dikumpulkan.</p><div class="sc">${sc}</div><div class="mu">nilai akhir (0–100)</div><p class="mu">Pembahasan tidak ditampilkan. Silakan menghubungi gurumu.</p></div>`;}
function result(){if(S.cheat)return cheatResult();const sc=skor(Q.map((q,i)=>S.ans[i]===q.k));app.innerHTML=`<div class="card"><h1>Hasil ujian</h1><div class="mu">${esc(S.name)} · Kelas ${esc(S.kelas)}</div><div class="sc" style="margin-top:12px">${sc}</div><div class="mu">nilai akhir (0–100)</div><p class="mu">Pembahasan tidak ditampilkan. Silakan menghubungi gurumu.</p></div>`;window.scrollTo(0,0);}
start0();
</script></body></html>
